name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    name: Gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
          cache: true
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - name: Install Make on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install make --no-progress -y
      - name: Run the gate
        run: make check
      - name: Build and run the M2 smoke (Unix)
        if: runner.os != 'Windows'
        run: make build && ./scripts/smoke/m2.sh ./bin/dropserve
      - name: Build and run the M2 smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          make build
          ./scripts/smoke/m2.ps1 -Binary ./bin/dropserve.exe
      - name: Run the M5 smoke (Unix)
        if: runner.os != 'Windows'
        run: ./scripts/smoke/m5.sh ./bin/dropserve
      - name: Run the M5 smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke/m5.ps1 -Binary ./bin/dropserve.exe

  golangci:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
          cache: true
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: latest

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
