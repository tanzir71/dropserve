name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    name: Gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
          cache: true
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - name: Install Make on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install make --no-progress -y
      - name: Run the gate
        run: make check
      - name: Build and run the M2 smoke (Unix)
        if: runner.os != 'Windows'
        run: make build && ./scripts/smoke/m2.sh ./bin/dropserve
      - name: Build and run the M2 smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          make build
          ./scripts/smoke/m2.ps1 -Binary ./bin/dropserve-cli.exe
      - name: Run the M5 smoke (Unix)
        if: runner.os != 'Windows'
        run: ./scripts/smoke/m5.sh ./bin/dropserve
      - name: Run the M5 smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke/m5.ps1 -Binary ./bin/dropserve-cli.exe
      - name: Run the M6 Windows autostart smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke/m6.ps1 -Binary ./bin/dropserve-cli.exe -BackgroundBinary ./bin/dropserve.exe
      - name: Run the M6 Windows background smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke/m6-background.ps1 -Binary ./bin/dropserve.exe
      - name: Run the M6 Linux autostart smoke
        if: runner.os != 'Windows'
        run: ./scripts/smoke/m6.sh ./bin/dropserve

  golangci:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
          cache: true
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: latest

  vulnerabilities:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
          cache: true
      - name: Reject reachable and module-only vulnerabilities
        shell: bash
        run: |
          set +e
          output=$(go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 -show verbose ./... 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ] || grep -q '^Vulnerability #' <<< "$output"; then
            exit 1
          fi
      - name: gosec
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.29.0 ./...

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows-installer:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
          cache: true
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build Dropserve binaries
        shell: pwsh
        run: go run ./scripts/gate.go build
      - name: Self-sign and verify installed binaries
        shell: pwsh
        run: ./scripts/release/m10-signing.ps1 -Files ./bin/dropserve.exe,./bin/dropserve-cli.exe -TrustedVerification
      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = Get-ChildItem -Path ${env:ProgramFiles(x86)},$env:ProgramFiles -Recurse -Filter ISCC.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $iscc) { throw 'ISCC.exe was not installed' }
          $sourceDir = (Resolve-Path bin).Path
          $outputDir = Join-Path (Resolve-Path .).Path 'dist\installer'
          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null
          & $iscc.FullName "/DSourceDir=$sourceDir" "/DOutputDir=$outputDir" '/DAppVersion=0.0.0-ci' '/DNumericVersion=0.0.0.0' /Q packaging/windows/dropserve.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC exited $LASTEXITCODE" }
      - name: Silent install and uninstall smoke
        shell: pwsh
        run: ./scripts/release/m10-installer.ps1 -Installer ./dist/installer/dropserve-0.0.0-ci-windows-amd64-setup.exe
      - name: Fresh Windows VM and separate WSL2 network smoke
        shell: pwsh
        run: ./scripts/release/m10-fresh-machine.ps1 -Installer ./dist/installer/dropserve-0.0.0-ci-windows-amd64-setup.exe

  landing-page:
    name: Landing page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate HTML
        run: npx --yes html-validate@11.10.0 docs/index.html
