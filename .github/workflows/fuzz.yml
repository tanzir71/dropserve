name: Nightly fuzz

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: Slug and path fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
          cache: true
      - name: Fuzz slug sanitiser for 60 seconds
        run: go test ./internal/scanner -run=^$ -fuzz=^FuzzSlugSanitiser$ -fuzztime=60s
      - name: Fuzz path resolver for 60 seconds
        run: go test ./internal/static -run=^$ -fuzz=^FuzzPathResolver$ -fuzztime=60s
